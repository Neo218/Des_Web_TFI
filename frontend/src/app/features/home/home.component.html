<div class="home-container">
  <div class="welcome-section">
    <div class="welcome-badge">Dashboard</div>
    <h1>Gestiona tus proyectos</h1>
    <p>Clientes, proyectos y tareas en un solo lugar</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card" (click)="navigateTo('/clientes')">
      <div class="stat-icon clients">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="stat-info">
        <h3>Clientes</h3>
        <p>Gestiona tu cartera</p>
      </div>
      <svg class="stat-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9,18 15,12 9,6"/>
      </svg>
    </div>

    <div class="stat-card" (click)="navigateTo('/proyectos')">
      <div class="stat-icon projects">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 3v18"/>
          <path d="M15 3v18"/>
          <path d="M3 9h18"/>
          <path d="M3 15h18"/>
        </svg>
      </div>
      <div class="stat-info">
        <h3>Proyectos</h3>
        <p>Administra tus proyectos</p>
      </div>
      <svg class="stat-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9,18 15,12 9,6"/>
      </svg>
    </div>

    <div class="stat-card" (click)="navigateTo('/tareas')">
      <div class="stat-icon tasks">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </div>
      <div class="stat-info">
        <h3>Tareas</h3>
        <p>Sigue el progreso</p>
      </div>
      <svg class="stat-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9,18 15,12 9,6"/>
      </svg>
    </div>
  </div>

  <div class="quick-actions">
    <h2>Acciones rápidas</h2>
    <div class="actions-grid">
      <button class="action-card" (click)="navigateTo('/clientes', { create: 'true' })">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nuevo Cliente</span>
      </button>
      <button class="action-card" (click)="navigateTo('/proyectos', { create: 'true' })">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nuevo Proyecto</span>
      </button>
      <button class="action-card" (click)="navigateTo('/tareas', { create: 'true' })">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nueva Tarea</span>
      </button>
    </div>
  </div>
</div>
